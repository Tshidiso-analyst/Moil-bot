name: Gemini Coding Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  dispatch:
    if: >-
      github.event.sender.type == 'User' &&
      startsWith(github.event.comment.body, '@gemini-cli') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      command: ${{ steps.route.outputs.command }}
      request: ${{ steps.route.outputs.request }}
    steps:
      - name: Route Gemini request
        id: route
        uses: actions/github-script@v7
        env:
          REQUEST: ${{ github.event.comment.body }}
        with:
          script: |
            const request = process.env.REQUEST || "";
            const command = request.startsWith("@gemini-cli /approve") ? "approve" : "invoke";
            const cleaned = request
              .replace(/^@gemini-cli\s*\/?approve?\s*/i, "")
              .replace(/^@gemini-cli\s*/i, "")
              .trim();
            core.setOutput("command", command);
            core.setOutput("request", cleaned);

  invoke:
    needs: dispatch
    if: needs.dispatch.outputs.command == 'invoke'
    uses: ./.github/workflows/gemini-invoke.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      additional_context: ${{ needs.dispatch.outputs.request }}
    secrets: inherit

  plan-execute:
    needs: dispatch
    if: needs.dispatch.outputs.command == 'approve'
    uses: ./.github/workflows/gemini-plan-execute.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      additional_context: ${{ needs.dispatch.outputs.request }}
    secrets: inherit
