name: Demo execution and backtest safety tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install "numpy==2.2.6" "pandas==2.3.3" "pytest==9.1.1"
      - name: Test demo execution safety and backtesting
        run: >-
          python -m pytest -q
          execution/tests/test_demo_pipeline.py
          backtesting/tests/test_smc_runner.py
          backtesting/tests/test_cost_aware_engine.py
