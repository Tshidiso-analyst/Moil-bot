name: Intelligence foundation tests

on:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "alerts/**"
      - "fundamentals/**"
      - "strategy/**"
      - "notifications/**"
      - "dashboard/realtime_pipeline.py"
      - "dashboard/app.py"
      - "dashboard/tests/test_realtime_pipeline_calendar.py"
      - ".github/workflows/intelligence-tests.yml"
  pull_request:
    paths:
      - "alerts/**"
      - "fundamentals/**"
      - "notifications/**"
      - "strategy/**"
      - "dashboard/app.py"
      - "dashboard/realtime_pipeline.py"
      - "dashboard/tests/test_realtime_pipeline_calendar.py"
      - ".github/workflows/intelligence-tests.yml"

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pandas numpy
      - name: Compile changed Python modules
        run: python -m compileall -q fundamentals alerts notifications strategy dashboard
      - name: Run event, alert and pipeline tests
        run: >-
          python -m pytest
          fundamentals/tests
          alerts/tests
          dashboard/tests/test_realtime_pipeline_calendar.py
          strategy/tests/test_entry_confirmation.py
          strategy/tests/test_engine.py
          -q
