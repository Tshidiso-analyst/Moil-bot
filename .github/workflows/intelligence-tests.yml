name: Moil-bot full regression

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: moilbot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements-render.txt
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-render.txt
      - name: Compile Python source
        run: python -m compileall -q .
      - name: Run full automated test suite
        run: |
          python -m pytest -q \
            --ignore=execution/mt5_connection_test.py \
            --ignore=execution/demo_trade_smoke_test.py

  windows-mt5-regression:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements-render.txt
      - name: Install project, test, and Windows MT5 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-render.txt
          python -m pip install MetaTrader5==5.0.6180
      - name: Verify Windows MT5 package and account-mode constants
        run: |
          python -c "import MetaTrader5 as mt5; assert mt5.ACCOUNT_TRADE_MODE_DEMO == 0; assert mt5.ACCOUNT_TRADE_MODE_CONTEST == 1; assert mt5.ACCOUNT_TRADE_MODE_REAL == 2; print('MT5 package and account-mode constants verified')"
      - name: Compile Python source
        run: python -m compileall -q .
      - name: Run full automated test suite
        run: |
          python -m pytest -q --ignore=execution/mt5_connection_test.py --ignore=execution/demo_trade_smoke_test.py
