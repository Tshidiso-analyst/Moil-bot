name: XAUUSD safety regression

on:
  push:
    branches:
      - codex/xauusd-market-data-safety
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      MOILBOT_CLOUD_MODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install non-MT5 test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-render.txt
      - name: Compile trading and knowledge modules
        run: python -m compileall -q execution risk strategy backtesting market_data knowledge
      - name: Run tests without connecting to MT5
        run: python -m pytest -q --ignore=execution/mt5_connection_test.py
